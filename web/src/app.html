<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0FB5AE" />

    <!-- Senza questo link il manifest non viene mai letto e l'app non è
         installabile, per quanto il file esista. -->
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />

    <!-- iOS ignora le icone del manifest: senza apple-touch-icon mette in home
         una miniatura della pagina. Vuole un PNG opaco — la trasparenza la
         rende nera. -->
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ELITE" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "default" tiene la barra di stato leggibile sullo sfondo chiaro; con
         "black-translucent" il contenuto ci finirebbe sotto. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Manrope è self-ospitato (@font-face in app.css). Il preload evita che
         il carattere venga scoperto solo dopo il parsing del CSS. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="%sveltekit.assets%/fonts/manrope-latin.woff2"
      crossorigin
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
